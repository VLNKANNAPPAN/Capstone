[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "capstone-market-platform"
version = "0.1.0"
description = "Point-in-time financial data platform for multi-agent research"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "msoffcrypto-tool>=5.4,<6",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "SQLAlchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
  "xlrd>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
]

[project.scripts]
capstone-data = "market_platform.cli:main"
capstone-api = "market_platform.api.app:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["market_platform"]
